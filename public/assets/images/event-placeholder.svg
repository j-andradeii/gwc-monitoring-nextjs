<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d4a6f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d5a7f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0a067;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4b896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0a067;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)"/>

  <!-- Subtle pattern overlay -->
  <pattern id="pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.05)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#pattern)"/>

  <!-- Calendar icon -->
  <g transform="translate(340, 140)">
    <!-- Calendar body -->
    <rect x="0" y="20" width="120" height="100" rx="12" fill="url(#goldGradient)" opacity="0.9"/>
    <!-- Calendar top -->
    <rect x="0" y="20" width="120" height="35" rx="12" fill="url(#goldGradient)"/>
    <rect x="0" y="40" width="120" height="15" fill="url(#goldGradient)"/>
    <!-- Calendar rings -->
    <rect x="25" y="10" width="8" height="25" rx="4" fill="url(#goldGradient)"/>
    <rect x="87" y="10" width="8" height="25" rx="4" fill="url(#goldGradient)"/>
    <!-- Calendar lines -->
    <line x1="20" y1="75" x2="100" y2="75" stroke="rgba(30,58,95,0.3)" stroke-width="2"/>
    <line x1="20" y1="95" x2="80" y2="95" stroke="rgba(30,58,95,0.3)" stroke-width="2"/>
  </g>

  <!-- Text -->
  <text x="400" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">
    Event Image
  </text>
  <text x="400" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">
    Gateway Church
  </text>
</svg>
